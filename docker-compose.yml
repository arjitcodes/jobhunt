version: '3.8'

services:
  backend:
    build: .
    container_name: jobhunt_backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env.production 
    volumes:
      - ./public/uploads:/app/public/uploads

  nginx:
    image: nginx:alpine
    container_name: jobhunt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/app/public/uploads:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: jobhunt_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot