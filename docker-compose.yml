version: '3.8'

services:
  backend:
    build: .
    container_name: jobhunt_backend
    restart: always # Change to 'always' to ensure it stays up
    # expose: - "5000" is fine, but Nginx will find it via the service name
    env_file:
      - .env.production 
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - jobhunt_network

  nginx:
    image: nginx:alpine
    container_name: jobhunt_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/app/public/uploads:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - jobhunt_network

  certbot:
    image: certbot/certbot
    container_name: jobhunt_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - jobhunt_network

networks:
  jobhunt_network:
    driver: bridge